services:
  nginx:
    image: nginx:latest
    ports:
      - '8080:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - backend1
      - backend2
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped
  backend:
    build: .
    env_file:
      - .env
    environment:
      - SERVER_NAME="value1"
    ports:
      - '5000:8080'
    depends_on:
      - redis
    restart: unless-stopped
  backend1:
    build: .
    env_file:
      - .env
    environment:
      - SERVER_NAME="value2"
    ports:
      - '5001:8080'
    depends_on:
      - redis
    restart: unless-stopped
  backend2:
    build: .
    env_file:
      - .env
    environment:
      - SERVER_NAME="value3"
    ports:
      - '5002:8080'
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
